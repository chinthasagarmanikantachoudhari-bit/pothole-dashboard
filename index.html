<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous Rover Mission Hub</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151d30;
      --card: #1e293b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.15rem; color: var(--accent); }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-pill {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .disconnected { background: #475569; }
    .connected { background: var(--success); color: #000; }
    .btn-notif {
      background: var(--card);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .badge {
      background: var(--danger);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 850px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #1e293b;
    }
    .panel-title {
      margin: 0 0 10px 0;
      font-size: 0.95rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    video {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      background: #000;
    }
    #map {
      width: 100%;
      height: 220px;
      border-radius: 8px;
    }
    .telemetry-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.88rem;
    }
    /* Mode Selectors */
    .mode-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      border-color: var(--accent);
      background: #0284c7;
      color: #fff;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .control-row { display: flex; gap: 6px; }
    button {
      background: #334155;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:active { background: var(--accent); color: black; }
    button.danger { background: var(--danger); }
    .ip-input {
      background: var(--bg);
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 110px;
    }
    #notifModal {
      display: none;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 100%;
      max-width: 400px;
      background: #0f172a;
      box-shadow: -4px 0 20px rgba(0,0,0,0.8);
      z-index: 9999;
      padding: 16px;
      overflow-y: auto;
      border-left: 1px solid #334155;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .incident-card {
      background: var(--card);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      font-size: 0.82rem;
    }
    .incident-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .gmaps-btn {
      display: inline-block;
      margin-top: 6px;
      background: #2563eb;
      color: #fff;
      padding: 6px 12px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.75rem;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>🚗 Rover Hub</h1>
      <button class="btn-notif" onclick="toggleNotifPanel()">
        🔔 Notifications <span id="badgeCount" class="badge">0</span>
      </button>
    </div>
    <div class="header-actions">
      <input type="text" id="espIp" class="ip-input" value="192.168.4.1" />
      <button id="wsBtn" onclick="toggleConnection()">Connect</button>
      <span id="wsStatus" class="status-pill disconnected">Offline</span>
    </div>
  </header>

  <div class="grid">
    <!-- Camera View -->
    <div class="panel">
      <div class="panel-title">
        <span>Phone Webcam Feed</span>
        <div>
          <button onclick="startCamera()">Start Cam</button>
          <button onclick="switchCamera()">Flip</button>
        </div>
      </div>
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="snapshotCanvas"></canvas>
      <div style="margin-top: 10px;">
        <button class="danger" style="width: 100%;" onclick="logIncident('MANUAL_MARK')">
          📸 Manual Snap & Log Pothole
        </button>
      </div>
    </div>

    <!-- Live Map -->
    <div class="panel">
      <div class="panel-title">Live GPS Location</div>
      <div id="map"></div>
      <div style="margin-top: 10px;">
        <div class="telemetry-row">
          <span>Coordinates:</span> <strong id="coordsVal">Waiting for GPS...</strong>
        </div>
        <div class="telemetry-row">
          <span>Ultrasonic Sensor:</span> <strong id="obstacleVal" style="color:var(--success)">CLEAR</strong>
        </div>
      </div>
    </div>

    <!-- Mode Selector & Controls -->
    <div class="panel" style="grid-column: 1 / -1;">
      <div class="panel-title">Drive Mode & Controls</div>

      <div class="mode-bar">
        <button id="btnManual" class="mode-btn active" onclick="setMode('MANUAL')">🕹️ MANUAL MODE</button>
        <button id="btnAuto" class="mode-btn" onclick="setMode('AUTO')">🤖 AUTOMATIC MODE</button>
      </div>

      <div id="manualControlsArea" class="controls">
        <button onclick="sendCommand('FORWARD')">▲ FORWARD</button>
        <div class="control-row">
          <button onclick="sendCommand('LEFT')">◄ LEFT</button>
          <button class="danger" onclick="sendCommand('STOP')">■ STOP</button>
          <button onclick="sendCommand('RIGHT')">RIGHT ►</button>
        </div>
        <button onclick="sendCommand('BACKWARD')">▼ BACKWARD</button>
      </div>
      <div id="autoStatusArea" style="display:none; text-align:center; padding: 12px; color: var(--accent); font-weight: bold;">
        🚗 Autonomous Pilot Engaged — Rover is steering around obstacles automatically.
      </div>
    </div>
  </div>

  <!-- Notification Drawer -->
  <div id="notifModal">
    <div class="modal-head">
      <h2 style="margin: 0; font-size: 1.1rem; color: var(--accent);">🚨 Pothole & Incident Records</h2>
      <div>
        <button onclick="clearNotifications()" style="padding: 4px 8px; font-size: 0.75rem;">Clear</button>
        <button onclick="toggleNotifPanel()" style="padding: 4px 8px; font-size: 0.75rem;">✕ Close</button>
      </div>
    </div>
    <div id="notificationList">
      <p style="color: var(--muted); font-size: 0.85rem;">No detections registered yet.</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let ws = null;
    let pollTimer = null;
    let map, marker;
    let currentStream = null;
    let facingMode = "environment";
    let curLat = 16.5062, curLng = 80.6480;
    let incidentCount = 0;
    let lastAutoTrigger = 0;

    const savedIncidents = JSON.parse(localStorage.getItem('rover_incidents') || '[]');

    function initMap() {
      map = L.map('map').setView([curLat, curLng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      marker = L.marker([curLat, curLng]).addTo(map).bindPopup("Rover Position");
    }
    initMap();

    function loadSavedIncidents() {
      if (savedIncidents.length > 0) {
        document.getElementById('notificationList').innerHTML = '';
        savedIncidents.forEach(item => renderIncidentCard(item, false));
        incidentCount = savedIncidents.length;
        document.getElementById('badgeCount').textContent = incidentCount;
      }
    }
    loadSavedIncidents();

    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } }
        });
        document.getElementById('webcam').srcObject = currentStream;
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    function switchCamera() {
      facingMode = (facingMode === "user") ? "environment" : "user";
      startCamera();
    }

    function takeSnapshot() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('snapshotCanvas');
      if (!video.videoWidth) return null;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, canvas.height - 42, canvas.width, 42);
      ctx.fillStyle = "#ffffff";
      ctx.font = "16px sans-serif";
      ctx.fillText(`${new Date().toLocaleTimeString()} | GPS: ${curLat.toFixed(6)}, ${curLng.toFixed(6)}`, 14, canvas.height - 16);

      return canvas.toDataURL('image/jpeg');
    }

    async function fetchAddress(lat, lng) {
      try {
        const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
        const data = await resp.json();
        return data.display_name || "Street address not found";
      } catch (e) {
        return "Address lookup unavailable";
      }
    }

    async function logIncident(type) {
      const photo = takeSnapshot();
      const timeStr = new Date().toLocaleTimeString();
      const lat = curLat;
      const lng = curLng;

      const pin = L.circleMarker([lat, lng], { color: 'red', fillColor: '#f03', fillOpacity: 0.8, radius: 9 }).addTo(map);
      pin.bindPopup(`<b>${type}</b><br>${timeStr}`).openPopup();

      const address = await fetchAddress(lat, lng);

      const incidentData = {
        id: Date.now(),
        type,
        time: timeStr,
        lat: lat.toFixed(6),
        lng: lng.toFixed(6),
        address,
        photo
      };

      savedIncidents.unshift(incidentData);
      localStorage.setItem('rover_incidents', JSON.stringify(savedIncidents.slice(0, 30)));

      renderIncidentCard(incidentData, true);
      incidentCount++;
      document.getElementById('badgeCount').textContent = incidentCount;

      sendCommand("POTHOLE_LOGGED");
    }

    function renderIncidentCard(data, prepend = true) {
      const list = document.getElementById('notificationList');
      if (incidentCount === 0 && prepend) list.innerHTML = '';

      const card = document.createElement('div');
      card.className = 'incident-card';

      const mapLink = `https://www.google.com/maps?q=${data.lat},${data.lng}`;
      const imgTag = data.photo ? `<img src="${data.photo}" alt="Incident">` : `<div style="background:#0f172a;height:80px;display:flex;align-items:center;justify-content:center;border-radius:4px;margin-bottom:6px;">No Image</div>`;

      card.innerHTML = `
        ${imgTag}
        <strong style="color:var(--danger)">⚠️ ${data.type}</strong>
        <div style="margin-top:4px;">🕒 <b>Time:</b> ${data.time}</div>
        <div>📍 <b>GPS:</b> ${data.lat}, ${data.lng}</div>
        <div style="margin-top:4px; color:var(--muted);">🏛️ <b>Address:</b> ${data.address}</div>
        <div style="margin-top:8px; display:flex; gap:8px;">
          <a class="gmaps-btn" href="${mapLink}" target="_blank">🗺️ Open Google Maps</a>
          ${data.photo ? `<a class="gmaps-btn" style="background:#475569;" href="${data.photo}" download="incident_${data.id}.jpg">⬇ Save</a>` : ''}
        </div>
      `;

      if (prepend) list.prepend(card);
      else list.appendChild(card);
    }

    function toggleNotifPanel() {
      const modal = document.getElementById('notifModal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
    }

    function clearNotifications() {
      localStorage.removeItem('rover_incidents');
      savedIncidents.length = 0;
      incidentCount = 0;
      document.getElementById('badgeCount').textContent = '0';
      document.getElementById('notificationList').innerHTML = '<p style="color: var(--muted); font-size: 0.85rem;">No detections registered yet.</p>';
    }

    function setMode(mode) {
      const btnM = document.getElementById('btnManual');
      const btnA = document.getElementById('btnAuto');
      const manualArea = document.getElementById('manualControlsArea');
      const autoArea = document.getElementById('autoStatusArea');

      if (mode === 'AUTO') {
        btnA.classList.add('active');
        btnM.classList.remove('active');
        manualArea.style.display = 'none';
        autoArea.style.display = 'block';
        sendCommand('MODE_AUTO');
      } else {
        btnM.classList.add('active');
        btnA.classList.remove('active');
        manualArea.style.display = 'flex';
        autoArea.style.display = 'none';
        sendCommand('MODE_MANUAL');
      }
    }

    function handleTelemetryData(lat, lng, obstacle) {
      if (!isNaN(lat) && !isNaN(lng)) {
        curLat = lat;
        curLng = lng;
        document.getElementById('coordsVal').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        marker.setLatLng([lat, lng]);
        map.panTo([lat, lng]);
      }
      const el = document.getElementById('obstacleVal');
      el.textContent = obstacle;
      if (obstacle === "FRONT_DETECTED") {
        el.style.color = "var(--danger)";
        const now = Date.now();
        if (now - lastAutoTrigger > 4000) {
          lastAutoTrigger = now;
          logIncident("AUTO_POTHOLE_OBSTACLE");
        }
      } else {
        el.style.color = "var(--success)";
      }
    }

    function toggleConnection() {
      const ip = document.getElementById('espIp').value.trim();
      const statusEl = document.getElementById('wsStatus');
      const btn = document.getElementById('wsBtn');

      if (statusEl.classList.contains('connected')) {
        if (ws) ws.close();
        if (pollTimer) clearInterval(pollTimer);
        statusEl.textContent = 'Offline';
        statusEl.className = 'status-pill disconnected';
        btn.textContent = 'Connect';
        return;
      }

      try {
        ws = new WebSocket(`ws://${ip}:81/`);
        ws.onopen = () => {
          statusEl.textContent = 'Online';
          statusEl.className = 'status-pill connected';
          btn.textContent = 'Disconnect';
        };
        ws.onmessage = (e) => {
          const msg = e.data;
          if (msg.startsWith("GPS:")) {
            const parts = msg.replace("GPS:", "").split(",");
            handleTelemetryData(parseFloat(parts[0]), parseFloat(parts[1]), document.getElementById('obstacleVal').textContent);
          } else if (msg.startsWith("OBSTACLE:")) {
            handleTelemetryData(curLat, curLng, msg.replace("OBSTACLE:", ""));
          }
        };
        ws.onerror = () => startHttpPolling(ip);
      } catch (e) {
        startHttpPolling(ip);
      }
    }

    function startHttpPolling(ip) {
      const statusEl = document.getElementById('wsStatus');
      const btn = document.getElementById('wsBtn');
      if (pollTimer) clearInterval(pollTimer);

      pollTimer = setInterval(async () => {
        try {
          const res = await fetch(`http://${ip}/status`, { cache: 'no-store' });
          const data = await res.json();
          statusEl.textContent = 'Online';
          statusEl.className = 'status-pill connected';
          btn.textContent = 'Disconnect';
          handleTelemetryData(data.lat, data.lng, data.obstacle);
        } catch (e) {
          statusEl.textContent = 'Offline';
          statusEl.className = 'status-pill disconnected';
        }
      }, 1000);
    }

    function sendCommand(cmd) {
      const ip = document.getElementById('espIp').value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
      } else {
        fetch(`http://${ip}/cmd?action=${cmd}`).catch(() => {});
      }
    }
  </script>
</body>
</html>
